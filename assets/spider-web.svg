<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 1100"
     role="img"
     aria-label="Uma única aranha descendo por uma teia do topo até o final">

  <defs>
    <linearGradient id="webGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="dropPath"
          d="M600 70
             C575 180 625 280 600 380
             C570 500 630 590 600 700
             C570 810 625 905 600 1015"/>

    <style>
      .web {
        fill: none;
        stroke: url(#webGlow);
        stroke-width: 1.5;
        stroke-linecap: round;
      }

      .web2 {
        fill: none;
        stroke: #ffffff;
        stroke-opacity: 0.16;
        stroke-width: 1;
        stroke-linecap: round;
      }

      .silk {
        stroke: #ffffff;
        stroke-opacity: 0.62;
        stroke-width: 1.5;
        stroke-linecap: round;
      }

      .body {
        fill: #101010;
        stroke: #ffffff;
        stroke-opacity: 0.75;
        stroke-width: 1.2;
      }

      .leg {
        fill: none;
        stroke: #101010;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .eye {
        fill: #e3262e;
      }
    </style>
  </defs>

  <!-- Large single web spanning the whole animation -->
  <g opacity="0.95" filter="url(#softGlow)">
    <path class="web" d="M80 105 Q600 22 1120 105"/>
    <path class="web2" d="M60 210 Q600 110 1140 210"/>
    <path class="web2" d="M45 330 Q600 205 1155 330"/>
    <path class="web2" d="M35 465 Q600 325 1165 465"/>
    <path class="web2" d="M30 610 Q600 450 1170 610"/>
    <path class="web2" d="M38 760 Q600 570 1162 760"/>
    <path class="web2" d="M55 915 Q600 690 1145 915"/>
    <path class="web" d="M90 1020 Q600 820 1110 1020"/>

    <path class="web2" d="M600 35 Q430 180 300 1020"/>
    <path class="web2" d="M600 35 Q500 220 455 1050"/>
    <path class="web2" d="M600 35 Q560 250 545 1070"/>
    <path class="web2" d="M600 35 Q640 250 655 1070"/>
    <path class="web2" d="M600 35 Q700 220 745 1050"/>
    <path class="web2" d="M600 35 Q770 180 900 1020"/>
    <path class="web2" d="M600 35 Q850 150 1040 900"/>
  </g>

  <!-- One continuous silk thread -->
  <path class="silk" d="M600 0 L600 1018">
    <animate attributeName="opacity"
             values="0.3;0.8;0.3"
             dur="2.6s"
             repeatCount="indefinite"/>
  </path>

  <!-- ONE spider: top -> bottom -->
  <g>
    <animateMotion
      dur="12s"
      repeatCount="indefinite"
      rotate="0"
      keyTimes="0;0.5;1"
      keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
      calcMode="spline">
      <mpath href="#dropPath"/>
    </animateMotion>

    <!-- subtle body swing -->
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="-5 0 0;5 0 0;-5 0 0"
      dur="2.8s"
      repeatCount="indefinite"/>

    <g>
      <!-- legs -->
      <path class="leg" d="M-8 -2 L-34 -17 L-53 -42"/>
      <path class="leg" d="M-10 5 L-38 4 L-58 -10"/>
      <path class="leg" d="M-8 11 L-34 25 L-51 48"/>
      <path class="leg" d="M8 -2 L34 -17 L53 -42"/>
      <path class="leg" d="M10 5 L38 4 L58 -10"/>
      <path class="leg" d="M8 11 L34 25 L51 48"/>

      <!-- body -->
      <ellipse class="body" cx="0" cy="7" rx="14" ry="21"/>
      <circle class="body" cx="0" cy="-15" r="10"/>

      <!-- red eyes -->
      <ellipse class="eye" cx="-4" cy="-18" rx="2.2" ry="3.1"/>
      <ellipse class="eye" cx="4" cy="-18" rx="2.2" ry="3.1"/>
    </g>
  </g>

  <!-- bottom accent -->
  <g opacity="0.8">
    <circle cx="600" cy="1040" r="3" fill="#ffffff">
      <animate attributeName="r" values="2;5;2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
